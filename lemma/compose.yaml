# Lemma — start with:  cp .env.example .env  &&  edit LEMMA_PASSWORD  &&  docker compose up -d
#
# Works with Docker Compose v2 and with podman-compose. One service, one named volume.
# Everything personal lives in the volume `lemma-data` (a single SQLite file plus daily
# backups); the container itself is read-only and can be thrown away at any time.

name: lemma

services:
  lemma:
    build: .
    image: lemma:${LEMMA_TAG:-local}
    restart: unless-stopped
    init: true

    # Configuration and secrets come from .env (see .env.example).
    env_file:
      - .env
    environment:
      # Fixed by the image layout; not meant to be overridden from .env.
      DATA_DIR: /data
      WEB_DIR: /app/web
      HOST: 0.0.0.0
      PORT: "8000"
      # Where the port is published (see `ports` below). The app cannot see that from
      # inside the container, and says it in its log, where people look first.
      LEMMA_BIND: ${LEMMA_BIND:-127.0.0.1}
      LEMMA_PORT: "${LEMMA_PORT:-8000}"

    # Published on localhost only by default: put a reverse proxy or a tunnel in front,
    # or set LEMMA_BIND=0.0.0.0 in .env to reach it from the local network.
    ports:
      - "${LEMMA_BIND:-127.0.0.1}:${LEMMA_PORT:-8000}:8000"

    volumes:
      - lemma-data:/data

    # Services on the host itself — a local model server for the tutor, a Forgejo on the
    # same machine — are reached as http://host.docker.internal:<port>. Docker on Linux
    # does not have that name unless it is asked for here; Podman has it either way.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Hardening: unprivileged user, no capabilities, read-only root filesystem.
    # LEMMA_UID/GID only need changing for rootless Podman without subuid ranges (README).
    user: "${LEMMA_UID:-1000}:${LEMMA_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Asks the app itself, on whatever port it was told to use, so that override files
    # never have to replace this (not every Compose implementation replaces lists).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 8000) + '/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    stop_grace_period: 15s

volumes:
  lemma-data:

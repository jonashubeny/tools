<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Prezentace{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if user %}
  <header class="top">
    <a class="brand" href="{{ url_for('browse') }}">Prezentace</a>
    <nav>
      {% if user.is_admin %}<a href="{{ url_for('admin') }}">Uživatelé</a>{% endif %}
      <a href="{{ url_for('account') }}">{{ user.username }}</a>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link">Odhlásit</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="bottom">
    <span>Stránka je stále ve vývoji.</span>
    <span>Jonáš Hubený</span>
    <a href="https://github.com/jonashubeny/tools/tree/main/prezentace" target="_blank" rel="noopener">GitHub</a>
    <a href="https://instagram.com/ich_bin_jonda" target="_blank" rel="noopener">Instagram</a>
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
